name: ci-cd-backend

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - run: pip install poetry
      - run: poetry install
      - run: poetry run pytest tests/test.py -v

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set metadata
        id: meta
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-devops-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lab-devops-backend:${{ steps.meta.outputs.image_tag }}

  update-gitops:
      needs: build-and-push
      runs-on: ubuntu-latest
      if: github.event_name == 'push'
      steps:
        - name: Checkout GitOps repository
          uses: actions/checkout@v4
          with:
            repository: ${{ secrets.GITOPS_REPO }}
            token: ${{ secrets.GITOPS_TOKEN }}
            path: gitops

        - name: Setup Kustomize
          uses: imranismail/setup-kustomize@v2

        - name: Update image tag in kustomization
          run: |
            cd gitops/backend/k8s
            kustomize edit set image \
              ${{ secrets.DOCKERHUB_USERNAME }}/lab-devops-backend=\
              ${{ secrets.DOCKERHUB_USERNAME }}/lab-devops-backend:${{ needs.build-and-push.outputs.image_tag }}

        - name: Commit and push
          run: |
            cd gitops
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add .
            git commit -m "chore: update backend image tag to ${{ needs.build-and-push.outputs.image_tag }}" || echo "No changes to commit"
            git push